# EXPERIMENT ONLY (E-15, Option B). This test branch is never merged.
# Same workflow and job names as the real checks.yml. The job fails while the
# label exp-hold is present, so repeat runs of ONE workflow can be compared.
name: Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  tests:
    name: Tests and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fail while the exp-hold label is present
        env:
          HAS_HOLD: ${{ contains(github.event.pull_request.labels.*.name, 'exp-hold') }}
        run: test "$HAS_HOLD" != "true"
