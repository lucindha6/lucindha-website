# EXPERIMENT ONLY (E-15). Never merge. The pull request will be closed.
# Variant 2: the same-name job waits 45 seconds and then FAILS, so it finishes
# AFTER the genuine check has passed.
name: Lookalike experiment

on:
  pull_request:

permissions:
  contents: read

jobs:
  lookalike:
    name: Tests and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wait, then fail (variant 2)
        run: sleep 45 && exit 1
