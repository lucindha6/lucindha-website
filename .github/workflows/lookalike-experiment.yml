# EXPERIMENT ONLY (E-15). Never merge. The pull request will be closed.
# A job with the same name as the required check "Tests and dependency audit",
# also reported by GitHub Actions. Variant 1: it fails at once, so it finishes
# BEFORE the genuine check passes. If the pull request is then mergeable, a later
# same-name result overrides an earlier one (the lookalike attack would work).
name: Lookalike experiment

on:
  pull_request:

permissions:
  contents: read

jobs:
  lookalike:
    name: Tests and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fail at once (variant 1)
        run: exit 1
