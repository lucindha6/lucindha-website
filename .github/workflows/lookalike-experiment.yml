# EXPERIMENT ONLY (E-15). Never merge. The pull request will be closed.
# Control: the same-name job PASSES, to show whether the pull request is then
# mergeable (so that "blocked" in the other variants is caused by the lookalike).
name: Lookalike experiment

on:
  pull_request:

permissions:
  contents: read

jobs:
  lookalike:
    name: Tests and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Pass at once (control)
        run: exit 0
