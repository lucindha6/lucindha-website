# EXPERIMENT ONLY (E-15, Option B). Never merged.
# A SECOND workflow with the same workflow name ("Checks") and job name as the
# genuine one. It runs only when the pull request title is edited, waits 30
# seconds and passes, to see whether it can override a genuine failure.
name: Checks

on:
  pull_request:
    types: [edited]

permissions:
  contents: read

jobs:
  lookalike:
    name: Tests and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wait, then pass
        run: sleep 30
