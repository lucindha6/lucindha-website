# TEMPORARY – remove this file before the pull request is marked ready for review.
#
# The enforced check (merge-hold.yml) runs from main, so it cannot run on the
# pull request that first adds it. This copy runs the pull request's own script
# so the director can see it fail with a DO NOT MERGE label and pass without one.
# It checks the hold label only (--only-hold-label), and has a different name,
# so it can never stand in for the real "Merge hold" check.
name: Merge hold demonstration

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  demonstration:
    name: Merge hold demonstration (temporary)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Fail while a DO NOT MERGE label is present
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/merge-hold.mjs --only-hold-label
