# Netlify settings for lucindha-website
# Netlify publishes everything inside the "site" folder. No build step is needed.
[build]
  publish = "site"
  command = ""

# Automatic acknowledgement email for the enquiry form (netlify/functions/submission-created.mjs).
# It is OFF unless the ACK_MODE environment variable is set to "test" or "live" in Netlify.
# See docs/enquiry-acknowledgement.md.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# PRE-LAUNCH: tells Google and other search engines not to list any page yet.
# Delete this whole [[headers]] block on launch day so the site can appear in search results.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# The home page lives at "/" - old /home links go there.
[[redirects]]
  from = "/home"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/home.html"
  to = "/"
  status = 301
  force = true
