<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<meta name="description" content="Lucindha Lawson – Accountant. Athlete. Coach. Speaker. AAT licensed accounting, sport and coaching, public speaking and accessible workshops for Deaf and hearing clients across the UK.">
<title>Welcome – Lucindha Lawson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..500,100;1,9..144,300..500,100&amp;display=swap">
<style>
html,body{height:100%}
body{margin:0;min-height:100%;color:#F7F3E8;font-family:'Atkinson Hyperlegible',Arial,sans-serif;font-size:1.125rem;line-height:1.6;background:#0B1F33;overflow-x:hidden}
/* soft, slowly breathing candle-light glow */
.glow{position:fixed;inset:0;pointer-events:none;z-index:0;
background:radial-gradient(60vmax 45vmax at 50% 38%,rgba(168,121,40,.20),transparent 62%),
radial-gradient(70vmax 60vmax at 0% 100%,rgba(74,48,70,.38),transparent 60%),
radial-gradient(70vmax 60vmax at 100% 0%,rgba(28,74,120,.32),transparent 60%),
linear-gradient(180deg,#0B1F33 0%,#0D2338 55%,#0A1B2D 100%)}
.glow::after{content:"";position:absolute;inset:0;background:radial-gradient(38vmax 30vmax at 50% 40%,rgba(203,171,116,.10),transparent 70%);animation:breathe 9s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
.wrap{position:relative;z-index:1;min-height:100vh;min-height:100svh;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:56px 24px;text-align:center}
.mark{width:auto;height:64px;opacity:.95;margin-bottom:28px}
h1{margin:0;font-family:'Fraunces',Georgia,serif;font-weight:300;font-style:italic;font-variation-settings:"SOFT" 100,"opsz" 144;
font-size:clamp(4.75rem,17vw,11rem);line-height:.9;letter-spacing:-.01em;
background:linear-gradient(180deg,#EAD8B6 0%,#CBAB74 55%,#B58C44 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 .08em .06em}
.name{margin:22px 0 0;font-family:'Fraunces',Georgia,serif;font-weight:400;font-variation-settings:"SOFT" 100,"opsz" 48;font-size:clamp(1.6rem,3.6vw,2.2rem);color:#F7F3E8}
.roles{margin:14px 0 0;font-size:clamp(1rem,2.2vw,1.15rem);letter-spacing:.22em;text-transform:uppercase;color:#CBAB74}
.roles span{color:#A87928}
@media (max-width:560px){.roles{letter-spacing:.14em;max-width:16em;line-height:1.9}}
.in{margin-top:44px;display:inline-flex;align-items:center;gap:12px;padding:14px 30px;border-radius:999px;border:1.5px solid rgba(203,171,116,.7);
color:#F7F3E8;text-decoration:none;font-family:'Fraunces',Georgia,serif;font-style:italic;font-weight:400;font-variation-settings:"SOFT" 100;font-size:1.3rem;
background:rgba(168,121,40,.08);transition:background .3s ease,border-color .3s ease,gap .3s ease}
.in:hover{background:rgba(168,121,40,.2);border-color:#CBAB74;gap:16px}
.in:focus-visible{outline:3px solid #CBAB74;outline-offset:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.fade{opacity:0;animation:fade 1.6s cubic-bezier(.2,.7,.2,1) forwards}
.f1{animation-delay:.1s}.f2{animation-delay:.5s}.f3{animation-delay:1.1s}.f4{animation-delay:1.5s}.f5{animation-delay:2s}
@keyframes fade{from{opacity:0;transform:translateY(10px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
@media (prefers-reduced-motion:reduce){.fade{opacity:1;animation:none}.glow::after{animation:none}.in{transition:none}}
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<main class="wrap">
<img class="mark fade f1" src="images/logo-mark.png" alt="" width="163" height="208">
<h1 class="fade f2">Hello</h1>
<p class="name fade f3">I'm Lucindha.</p>
<p class="roles fade f4">Accountant <span aria-hidden="true">·</span> Athlete <span aria-hidden="true">·</span> Coach <span aria-hidden="true">·</span> Speaker</p>
<a class="in fade f5" href="home.html">Come on in<span class="sr"> – enter the website</span> <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#CBAB74" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
</main>
</body>
</html>
