<!doctype html>
<html lang="en-GB">
<head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><title>Internal</title></head>
<body>
<p>Internal service. Nothing to see here.</p>
<!-- Netlify needs this hidden form in the published HTML so it accepts Stage 2 notices,
     which its form notification emails to hello@. Notices hold a reference and status only. -->
<form name="stage2-notice" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
<input type="hidden" name="form-name" value="stage2-notice">
<input name="bot-field">
<input name="subject">
<textarea name="message"></textarea>
</form>
</body>
</html>
